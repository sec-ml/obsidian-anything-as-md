# Build and package anything-as-md when a version tag is pushed.
# For manual runs: enter version number and the workflow creates the tag.
# Release notes are extracted from CHANGELOG.md (since the last
# release - i.e. can include multiple versions).
# Handles artefact attestations (for security scorecard).

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"   # e.g. 1.0.0 (no v prefix)
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    # https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/use-artifact-attestations
    # would only need contents: read, but as part of release, it already had/needed write.
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate artefact attestation
        uses: actions/attest@v4
        with:
          # Multiple items: https://github.com/actions/attest/blob/main/README.md#identify-multiple-subjects
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract changelog since last release
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the last published release tag, empty if none
          prev_rel=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")

          if [ -z "$prev_rel" ]; then
            # No previous release — include everything in the changelog
            NOTES=$(awk "/^## /{found=1} found{print}" CHANGELOG.md)
          else
            # Include all sections from the top down until before the previous release
            NOTES=$(awk "/^## /{found=1} found && /^## ${prev_rel}/{exit} found{print}" CHANGELOG.md)
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release and upload plugin files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
